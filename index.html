<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>condorZeitung</title>

  <link rel="stylesheet" href="dflip/css/dflip.min.css" />
  <link rel="stylesheet" href="dflip/css/themify-icons.min.css" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #090d18;
      --surface:      #0f1623;
      --border:       #1e2738;
      --text-primary: #f1f5f9;
      --text-muted:   #64748b;
      --accent:       #ffffff;
      --error:        #ef4444;
      --radius:       12px;
      --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── LOGIN ────────────────────────────────────────────────── */

    #login-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 0%, #162040 0%, #090d18 65%);
      z-index: 1000;
      padding: 24px 16px;
      transition: opacity 0.5s ease;
    }

    #login-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo encima del card */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .login-brand img {
      width: 68px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(255,255,255,0.12));
    }

    .login-brand-name {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Card */
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .login-header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .login-header p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #access-key {
      width: 100%;
      padding: 13px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 16px; /* evita zoom en iOS */
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    #access-key::placeholder { color: var(--text-muted); }

    #access-key:focus {
      border-color: #374151;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
    }

    #access-key.shake {
      animation: shake 0.4s ease;
      border-color: var(--error);
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(7px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }

    #error-msg {
      font-size: 12px;
      color: var(--error);
      min-height: 16px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    #error-msg.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #login-btn {
      width: 100%;
      min-height: 48px;
      padding: 13px;
      background: var(--accent);
      color: #090d18;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.1px;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    #login-btn:hover  { background: #e2e8f0; }
    #login-btn:active { transform: scale(0.98); }

    .login-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    /* ─── FLIPBOOK ─────────────────────────────────────────────── */

    #flipbook-container {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    #flipbook-container.visible { opacity: 1; }

    #df-flipbook {
      width: 100%;
      height: 100%;
    }

    .history-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1250;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(9,13,24,0.86);
      color: var(--text-primary);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .history-toggle.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .history-toggle:hover {
      background: rgba(15,22,35,0.95);
    }

    .history-toggle__icon {
      font-size: 14px;
    }

    .history-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.56);
      z-index: 1200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .history-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .history-panel {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(320px, 88vw);
      background: rgba(8,12,23,0.97);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.28s ease;
      z-index: 1250;
      display: flex;
      flex-direction: column;
      padding: 18px 14px 20px;
      backdrop-filter: blur(20px);
    }

    .history-panel.open {
      transform: translateX(0);
    }

    .history-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .history-panel__eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .history-panel__title {
      font-size: 17px;
      font-weight: 600;
    }

    .history-panel__close {
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      width: 100%;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: inherit;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    }

    .history-item:hover {
      background: rgba(255,255,255,0.07);
      transform: translateY(-1px);
    }

    .history-item.is-active {
      border-color: rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.09);
    }

    .history-item__label {
      font-size: 14px;
      font-weight: 600;
    }

    .history-item__meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .download-tip {
      position: fixed;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 250px;
      max-width: min(320px, 84vw);
      background: linear-gradient(135deg, #111827 0%, #0f172a 100%);
      color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.24);
      padding: 12px 14px;
      border-radius: 14px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.45);
      transform: translate(-50%, calc(-100% - 14px));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 1400;
      font-size: 14px;
      line-height: 1.35;
    }

    .download-tip.is-visible {
      opacity: 1;
      transform: translate(-50%, calc(-100% - 16px));
    }

    .download-tip::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #111827;
    }

    .download-tip__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.16);
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ─── RESPONSIVE ───────────────────────────────────────────── */

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
        border-radius: 16px;
        gap: 18px;
      }
      .login-brand img { width: 54px; }
      .login-brand { margin-bottom: 20px; }
      .login-header h1 { font-size: 18px; }
    }

    @media (max-height: 600px) {
      .login-brand { margin-bottom: 16px; }
      .login-brand img { width: 44px; }
    }
  </style>
</head>

<body>

  <!-- ─── LOGIN ─────────────────────────────────────────────────── -->
  <div id="login-screen">

    <div class="login-brand">
      <img src="CONDOR%20POSTS%20(10).png" alt="condorZeitung logo" />
      <span class="login-brand-name">condorZeitung</span>
    </div>

    <div class="login-card">
      <div class="login-header">
        <h1>Acceso restringido</h1>
        <p>Ingresa tu clave para ver la publicación.</p>
      </div>

      <div class="input-group">
        <input
          id="access-key"
          type="password"
          placeholder="Clave de acceso"
          autocomplete="current-password"
          spellcheck="false"
        />
        <span id="error-msg">Clave incorrecta. Intenta nuevamente.</span>
      </div>

      <button id="login-btn">Entrar</button>

      <p class="login-footer">Contenido privado &mdash; Uso exclusivo</p>
    </div>

  </div>

  <button id="history-toggle" class="history-toggle" type="button" aria-expanded="false" aria-controls="history-panel">
    <span class="history-toggle__icon">☰</span>
    <span>Archivo histórico</span>
  </button>

  <div id="history-backdrop" class="history-backdrop" hidden></div>

  <aside id="history-panel" class="history-panel" aria-label="Archivo histórico">
    <div class="history-panel__header">
      <div>
        <p class="history-panel__eyebrow">Ediciones</p>
        <h2 class="history-panel__title">Archivo histórico</h2>
      </div>
      <button id="history-close" class="history-panel__close" type="button" aria-label="Cerrar menú">✕</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </aside>

  <!-- ─── FLIPBOOK ───────────────────────────────────────────────── -->
  <div id="flipbook-container">
    <div id="download-tip" class="download-tip" role="status" aria-live="polite">
      <span class="download-tip__dot"></span>
      <span>Para descargar el PDF, abre el menú de tres puntos de abajo y elige Download PDF</span>
    </div>
    <div id="df-flipbook"></div>
  </div>

  <script>
    window.dFlipLocation = 'dflip/';
  </script>
  <script src="dflip/js/libs/jquery.min.js"></script>
  <script src="dflip/js/dflip.min.js"></script>

  <script>
    (function () {
      const PASSWORD = 'gutenmorgen123';
      const CURRENT_YEAR = new Date().getFullYear();
      const TIP_STORAGE_KEY = 'condorDownloadTipSeen';
      const TIP_DURATION_MS = 10000;

      const loginScreen  = document.getElementById('login-screen');
      const flipbookWrap = document.getElementById('flipbook-container');
      const input        = document.getElementById('access-key');
      const btn          = document.getElementById('login-btn');
      const errorMsg     = document.getElementById('error-msg');
      const historyToggle = document.getElementById('history-toggle');
      const historyPanel = document.getElementById('history-panel');
      const historyBackdrop = document.getElementById('history-backdrop');
      const historyClose = document.getElementById('history-close');
      const historyList = document.getElementById('history-list');
      const downloadTip = document.getElementById('download-tip');

      const editionFiles = [
        'Condor_09_04.pdf',
        'Condor_08_28.pdf',
        'Condor_08_21.pdf',
        'Condor_08_14.pdf',
        'Condor_08_07.pdf',
        'Condor_07_31.pdf',
        'Condor_07_24.pdf',
        'Condor_07_17.pdf',
        'Condor_07_10.pdf',
        'Condor_07_03.pdf',
        'Condor_06_26.pdf',
        'Condor_06_19.pdf',
        'Condor_06_12.pdf',
        'Condor_06_05.pdf',
        'Condor_05_29.pdf'
      ];

      const editions = editionFiles
        .map(function (fileName) {
          return {
            fileName: fileName,
            label: formatEditionLabel(fileName)
          };
        })
        .sort(function (a, b) {
          return parseEditionDate(b.fileName) - parseEditionDate(a.fileName);
        });

      let activeEdition = editions[0] ? editions[0].fileName : 'Condor_09_04.pdf';

      function formatEditionLabel(fileName) {
        const match = fileName.match(/Condor_(\d{2})_(\d{2})\.pdf$/i);
        if (!match) return fileName.replace(/\.pdf$/i, '');
        return 'Cóndor ' + match[2] + '/' + match[1] + '/' + CURRENT_YEAR;
      }

      function parseEditionDate(fileName) {
        const match = fileName.match(/Condor_(\d{2})_(\d{2})\.pdf$/i);
        if (!match) return 0;
        return new Date(CURRENT_YEAR, Number(match[1]) - 1, Number(match[2])).getTime();
      }

      function renderHistoryMenu() {
        historyList.innerHTML = '';

        editions.forEach(function (edition) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'history-item';
          if (edition.fileName === activeEdition) {
            button.classList.add('is-active');
          }
          button.dataset.fileName = edition.fileName;
          button.innerHTML = '<div class="history-item__label">' + edition.label + '</div><div class="history-item__meta">Abrir edición en PDF</div>';
          button.addEventListener('click', function () {
            loadEdition(edition.fileName);
          });
          historyList.appendChild(button);
        });
      }

      function showError() {
        errorMsg.classList.add('visible');
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');
        input.addEventListener('animationend', function h() {
          input.classList.remove('shake');
          input.removeEventListener('animationend', h);
        });
      }

      function clearError() {
        errorMsg.classList.remove('visible');
      }

      function openHistoryPanel() {
        historyPanel.classList.add('open');
        historyBackdrop.hidden = false;
        void historyBackdrop.offsetWidth;
        historyBackdrop.classList.add('visible');
        historyToggle.setAttribute('aria-expanded', 'true');
      }

      function closeHistoryPanel() {
        historyPanel.classList.remove('open');
        historyBackdrop.classList.remove('visible');
        historyToggle.setAttribute('aria-expanded', 'false');
        window.setTimeout(function () {
          historyBackdrop.hidden = true;
        }, 220);
      }

      function updateHistorySelection(fileName) {
        activeEdition = fileName;
        const items = historyList.querySelectorAll('.history-item');
        items.forEach(function (item) {
          item.classList.toggle('is-active', item.dataset.fileName === fileName);
        });
      }

      function getFlipbookOptions(source) {
        return {
          backgroundColor: '#090d18',
          controlsPosition: 'bottom',
          paddingTop: 10,
          paddingBottom: 50,
          webgl: true,
          autoEnableOutline: false,
          autoEnableThumbnail: false,
          source: source
        };
      }

      function positionDownloadTip() {
        const button = document.querySelector('#df-flipbook .df-ui-more');
        if (!button || !downloadTip) return;

        const buttonRect = button.getBoundingClientRect();
        const left = buttonRect.left + buttonRect.width / 2;
        const top = buttonRect.top - 10;

        downloadTip.style.left = Math.max(120, Math.min(left, window.innerWidth - 120)) + 'px';
        downloadTip.style.top = Math.max(24, top) + 'px';
      }

      function showDownloadTip() {
        if (!downloadTip) return;

        positionDownloadTip();
        downloadTip.classList.remove('is-visible');
        void downloadTip.offsetWidth;
        downloadTip.classList.add('is-visible');

        window.clearTimeout(showDownloadTip.timeoutId);
        showDownloadTip.timeoutId = window.setTimeout(function () {
          downloadTip.classList.remove('is-visible');
        }, TIP_DURATION_MS);
      }

      function ensureDownloadTip() {
        const button = document.querySelector('#df-flipbook .df-ui-more');
        if (button) {
          showDownloadTip();
          return;
        }

        window.setTimeout(ensureDownloadTip, 250);
      }

      function loadEdition(fileName) {
        updateHistorySelection(fileName);
        closeHistoryPanel();

        const $flipbook = $('#df-flipbook');
        $flipbook.empty();

        window.setTimeout(function () {
          $flipbook.flipBook(fileName, getFlipbookOptions(fileName));
          window.setTimeout(ensureDownloadTip, 450);
        }, 80);
      }

      function unlockFlipbook() {
        loginScreen.classList.add('fade-out');
        loginScreen.addEventListener('transitionend', function handler() {
          loginScreen.style.display = 'none';

          flipbookWrap.style.display = 'block';
          void flipbookWrap.offsetWidth;
          flipbookWrap.classList.add('visible');
          historyToggle.classList.add('is-visible');

          setTimeout(function () {
            loadEdition(activeEdition);
          }, 120);

        }, { once: true });
      }

      function validate() {
        const value = input.value.toLowerCase().trim();
        if (value === PASSWORD) {
          clearError();
          unlockFlipbook();
        } else {
          showError();
          input.select();
        }
      }

      renderHistoryMenu();

      historyToggle.addEventListener('click', function () {
        if (historyPanel.classList.contains('open')) {
          closeHistoryPanel();
        } else {
          openHistoryPanel();
        }
      });

      historyClose.addEventListener('click', closeHistoryPanel);
      historyBackdrop.addEventListener('click', closeHistoryPanel);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && historyPanel.classList.contains('open')) {
          closeHistoryPanel();
        }
      });

      window.addEventListener('resize', positionDownloadTip);

      const controlsObserver = new MutationObserver(function () {
        positionDownloadTip();
      });

      controlsObserver.observe(document.getElementById('df-flipbook'), { childList: true, subtree: true });

      btn.addEventListener('click', validate);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') validate();
        if (errorMsg.classList.contains('visible')) clearError();
      });
    })();
  </script>

</body>
</html>
